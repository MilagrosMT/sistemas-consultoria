services:
  # Aplicacion Laravel con PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: sistemas_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sistemas_consultoria
      DB_USERNAME: sistemas_user
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sistemas_network

  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: sistemas_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sistemas_consultoria
      MYSQL_USER: sistemas_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sistemas_network

  # Servidor web Nginx con recursos compilados
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: sistemas_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - sistemas_network

volumes:
  mysql_data:
  laravel_storage:

networks:
  sistemas_network:
    driver: bridge
